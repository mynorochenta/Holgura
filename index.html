<!doctype html>
<html lang="es" data-theme="papel">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0efeb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Holgura: programación lineal paso a paso con el método Simplex y la Gran M, verificada con un solver independiente." />
    <title>Holgura — Programación lineal paso a paso</title>
    <script>
      try {
        var t = localStorage.getItem('holgura-tema')
        if (/^(papel|blanco|sepia|pizarra)$/.test(t)) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
